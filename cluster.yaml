apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-upgrade-lab
  region: ap-south-1
  version: "1.35"

availabilityZones:
  - ap-south-1a
  - ap-south-1b

managedNodeGroups:
  - name: eks-lab-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20